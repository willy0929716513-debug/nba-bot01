name: NBA Odds Bot

on:
  # No `schedule:` trigger here on purpose. GitHub's own cron scheduling for
  # public-repo free-tier Actions is documented as best-effort and, confirmed
  # against this repo's real run history over 3+ weeks, was firing 5-11 hours
  # late every single day -- not an occasional blip, a consistent multi-hour
  # delay regardless of what time the cron was set to. There's no cron
  # expression that fixes a platform-level queuing delay. The daily run is
  # instead triggered externally by a scheduler outside GitHub Actions
  # entirely, which isn't subject to this throttling.
  #
  # That external trigger fires by committing a fresh timestamp to
  # .github/trigger/daily-run.txt on main, not by calling the
  # workflow_dispatch API -- the integration token available to that
  # scheduler has repo Contents:write (confirmed working: it's the same
  # permission every PR merge on this repo already uses) but not
  # Actions:write, so the `POST .../actions/workflows/.../dispatches`
  # endpoint 403s for it ("Resource not accessible by integration").
  # A plain content push needs no extra permission and is just as capable
  # of starting a workflow run.
  push:
    branches: [main]
    paths: ['.github/trigger/daily-run.txt']
  workflow_dispatch:
    inputs:
      official_run:
        description: '這是外部排程觸發的正式每日執行（手動測試請不要勾選）'
        type: boolean
        default: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_OFFICIAL_RUN: ${{ github.event_name == 'push' || inputs.official_run == true }}
        run: python nba_bot.py

      - name: Publish site data
        run: |
          if [ -n "$(git status --porcelain docs/data/latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/data/latest.json
            git commit -m "chore: update site data [skip ci]"
            git push
          else
            echo "No site data changes to publish"
          fi
