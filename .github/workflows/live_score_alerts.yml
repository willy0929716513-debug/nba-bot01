name: Live Score Alerts

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes, all day (repo is public: free/unlimited Actions minutes)
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: '只發一則測試推播，確認 NTFY_TOPIC 有設定成功、手機收得到通知（不檢查即時比分）'
        type: boolean
        default: false

concurrency:
  group: live-score-alerts
  cancel-in-progress: false

jobs:
  check-live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send test notification
        if: ${{ inputs.send_test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python nba_bot.py --live-alerts-test

      - name: Check live scores and push alerts
        if: ${{ !inputs.send_test_notification }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python nba_bot.py --live-alerts
